[package]
name = "ows-alloy"
version = "1.4.3"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "Alloy signer integration for Open Wallet Standard wallets"
repository = "https://github.com/open-wallet-standard/core"
readme = "README.md"

[dependencies]
ows-lib = { path = "../ows-lib", version = "=1.4.3" }
alloy-consensus = { version = "2.0", default-features = false }
alloy-network = { version = "2.0", default-features = false }
alloy-primitives = { version = "1.4.1", features = ["k256"] }
alloy-signer = { version = "2.0", features = ["eip712"] }
alloy-dyn-abi = { version = "1.4.1", features = ["eip712"] }
alloy-sol-types = "1.4.1"
async-trait = "0.1"
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
zeroize = "1"

[dev-dependencies]
ows-lib = { path = "../ows-lib", version = "=1.4.3", features = ["fast-kdf"] }
ows-core = { path = "../ows-core", version = "=1.4.3" }
alloy-signer-local = { version = "2.0", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
