[package]
name = "ows-midnight"
version = "1.4.3"
edition = "2021"
license = "MIT"
description = "Midnight chain integration (indexer sync + fund balance) for the Open Wallet Standard"
repository = "https://github.com/open-wallet-standard/core"

[dependencies]
ows-core = { path = "../ows-core", version = "=1.4.3" }
ows-signer = { path = "../ows-signer", version = "=1.4.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
bech32 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
bytes = "1.9"
zeroize = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
midnight-ledger = { version = "1.0.1", package = "midnight-ledger-v9" }
midnight-ledger-static = "10.0.0"
midnight-zswap = "9.0.1"
midnight-serialize = "1.2.1"
midnight-base-crypto = "1.1.1"
midnight-storage = "3.0.0"
midnight-coin-structure = "3.0.1"
transient-crypto = { version = "3.0.1", package = "midnight-transient-crypto" }
# Ledger 8, only to read the shielded history a network wrote before its hard fork to ledger 9.
midnight-ledger-v8 = { version = "8.1.3", package = "midnight-ledger" }
midnight-zswap-v8 = { version = "8.1.3", package = "midnight-zswap" }
midnight-storage-v8 = { version = "2.0.3", package = "midnight-storage" }
onchain-runtime = { version = "4.0.1", package = "midnight-onchain-runtime" }
zkir_v2 = { version = "2.2.0", package = "midnight-zkir" }
rand = "0.8"
anyhow = "1"
subxt = { version = "0.38", default-features = false, features = ["jsonrpsee", "native"] }
jsonrpsee = { version = "0.24", features = ["ws-client", "macros"] }

[dev-dependencies]
midnight-coin-structure-v8 = { version = "2.0.2", package = "midnight-coin-structure" }
